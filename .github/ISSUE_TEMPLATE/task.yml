name: 작업 이슈
description: 하나의 검증 가능한 JSL 작업을 추적합니다.
title: "[영역] "
body:
  - type: input
    id: parent
    attributes:
      label: 상위 목표·관련 PR
      description: 관련 번호와 선행 조건. 관련 항목이 있으면 적습니다.
  - type: textarea
    id: purpose
    attributes:
      label: 목적과 확인한 배경
      description: 사실·추론·미확인을 구분하고 근거를 적습니다.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      description: 한 줄에 한 행동을 체크박스로 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 판정 기준
      description: 검사 명령·기대 결과·관련 화면 크기와 진행률을 적습니다.
    validations:
      required: true
  - type: textarea
    id: preservation
    attributes:
      label: 제외·보존 범위
      description: 현재 사용자 승인 기준으로 바꾸지 않을 파일·장면·동작을 적습니다.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: 담당과 외부 입력
      description: GitHub 담당자를 지정합니다. 같은 계정의 AI 역할은 제작·검토 모델과 작업 세션으로 구분하고 공유 파일 소유자·사람이 해야 할 일을 적습니다.
    validations:
      required: true
