# PR과 main push마다 lint, 타입체크, 테스트를 돌린다.
# build는 Vercel 프리뷰가 확인하므로 여기서는 돌리지 않는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # mongodb-memory-server 가 내려받는 mongod 바이너리 위치. 캐시 경로와 맞춘다.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  frontend:
    name: frontend (lint, types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # TODO: 프런트 package-lock.json 이 package.json 과 맞지 않아 npm ci 가 실패한다
      # (next-intl 아래 @swc/helpers 항목 누락). Windows 에서 --package-lock-only 로 다시 만들면
      # @next/swc 플랫폼 바이너리(win32·darwin·linux-arm64 등)가 빠져 다른 OS 의 npm ci 가 깨진다.
      # Linux 에서 node_modules 와 락 파일을 지우고 npm install 로 새로 만든 뒤 npm ci 로 바꾼다.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      # next-env.d.ts 는 gitignore 대상이라 typegen 으로 만들어야 이미지 import 타입이 잡힌다.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test:units
